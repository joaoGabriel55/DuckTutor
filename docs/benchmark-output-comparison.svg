<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title description">
  <title id="title">Baseline and DuckTutor output tokens by benchmark scenario</title>
  <desc id="description">Two line charts compare baseline and DuckTutor average output tokens for Codex Sol and Claude Opus 5 across five scenarios.</desc>
  <style>
    :root { color-scheme: light dark; }
    .background { fill: #ffffff; }
    text { fill: #24292f; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 20px; font-weight: 600; }
    .provider { font-size: 17px; font-weight: 600; }
    .axis { stroke: #57606a; stroke-width: 1; }
    .grid { stroke: #d0d7de; stroke-width: 1; }
    .baseline { fill: none; stroke: #bc4c00; stroke-width: 3; }
    .ducktutor { fill: none; stroke: #0969da; stroke-width: 3; }
    .baseline-point { fill: #bc4c00; }
    .ducktutor-point { fill: #0969da; }
    .muted { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0d1117; }
      text { fill: #f0f6fc; }
      .axis { stroke: #8c959f; }
      .grid { stroke: #30363d; }
      .baseline { stroke: #d29922; }
      .ducktutor { stroke: #58a6ff; }
      .baseline-point { fill: #d29922; }
      .ducktutor-point { fill: #58a6ff; }
      .muted { fill: #8c959f; }
    }
  </style>

  <rect class="background" width="1000" height="760"/>

  <text class="title" x="70" y="34">Average output tokens by scenario</text>
  <line class="baseline" x1="660" y1="28" x2="700" y2="28"/>
  <text x="710" y="33">Baseline</text>
  <line class="ducktutor" x1="820" y1="28" x2="860" y2="28"/>
  <text x="870" y="33">DuckTutor</text>

  <text class="provider" x="70" y="78">Codex Sol</text>
  <text class="muted" x="18" y="190" transform="rotate(-90 18 190)">Output tokens</text>
  <line class="grid" x1="70" y1="100" x2="950" y2="100"/>
  <line class="grid" x1="70" y1="170" x2="950" y2="170"/>
  <line class="grid" x1="70" y1="240" x2="950" y2="240"/>
  <line class="axis" x1="70" y1="310" x2="950" y2="310"/>
  <line class="axis" x1="70" y1="100" x2="70" y2="310"/>
  <text class="muted" x="42" y="105">300</text>
  <text class="muted" x="42" y="175">200</text>
  <text class="muted" x="42" y="245">100</text>
  <text class="muted" x="56" y="315">0</text>
  <polyline class="baseline" points="90,119 300,221 510,145 720,146 930,242"><title>Codex Sol baseline</title></polyline>
  <polyline class="ducktutor" points="90,173 300,185 510,160 720,158 930,237"><title>Codex Sol DuckTutor</title></polyline>
  <g class="baseline-point"><circle cx="90" cy="119" r="4"/><circle cx="300" cy="221" r="4"/><circle cx="510" cy="145" r="4"/><circle cx="720" cy="146" r="4"/><circle cx="930" cy="242" r="4"/></g>
  <g class="ducktutor-point"><circle cx="90" cy="173" r="4"/><circle cx="300" cy="185" r="4"/><circle cx="510" cy="160" r="4"/><circle cx="720" cy="158" r="4"/><circle cx="930" cy="237" r="4"/></g>

  <text class="provider" x="70" y="390">Claude Opus 5</text>
  <text class="muted" x="18" y="515" transform="rotate(-90 18 515)">Output tokens</text>
  <line class="grid" x1="70" y1="410" x2="950" y2="410"/>
  <line class="grid" x1="70" y1="494" x2="950" y2="494"/>
  <line class="grid" x1="70" y1="578" x2="950" y2="578"/>
  <line class="axis" x1="70" y1="620" x2="950" y2="620"/>
  <line class="axis" x1="70" y1="410" x2="70" y2="620"/>
  <text class="muted" x="34" y="415">1000</text>
  <text class="muted" x="42" y="499">600</text>
  <text class="muted" x="42" y="583">200</text>
  <text class="muted" x="56" y="625">0</text>
  <polyline class="baseline" points="90,415 300,467 510,448 720,439 930,501"><title>Claude Opus 5 baseline</title></polyline>
  <polyline class="ducktutor" points="90,528 300,527 510,516 720,513 930,554"><title>Claude Opus 5 DuckTutor</title></polyline>
  <g class="baseline-point"><circle cx="90" cy="415" r="4"/><circle cx="300" cy="467" r="4"/><circle cx="510" cy="448" r="4"/><circle cx="720" cy="439" r="4"/><circle cx="930" cy="501" r="4"/></g>
  <g class="ducktutor-point"><circle cx="90" cy="528" r="4"/><circle cx="300" cy="527" r="4"/><circle cx="510" cy="516" r="4"/><circle cx="720" cy="513" r="4"/><circle cx="930" cy="554" r="4"/></g>

  <g class="muted" text-anchor="middle">
    <text x="90" y="650">Explain</text>
    <text x="300" y="650">Diff size</text>
    <text x="510" y="650">Abstraction</text>
    <text x="720" y="650">Coupling</text>
    <text x="930" y="650">Understanding</text>
  </g>
  <text class="muted" x="510" y="692" text-anchor="middle">Benchmark scenario</text>
  <text class="muted" x="70" y="730">Per-pair averages · 3 samples per scenario · 2026-09-03 · DuckTutor v0.10.0</text>
</svg>
